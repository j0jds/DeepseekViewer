<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus chats do DeepSeek</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        </span>
        <div>
          <div class="brand-title">Meus chats</div>
          <div class="brand-sub" id="brandSub">DeepSeek · arquivo local</div>
        </div>
      </div>
      <div class="searchbox">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Buscar em todos os chats" autocomplete="off" spellcheck="false">
        <kbd id="kbd">/</kbd>
      </div>
      <div class="chips" id="chips">
        <button class="chip on" data-f="all">Todos</button>
        <button class="chip" data-f="pinned">Fixados</button>
        <button class="chip" id="sortBtn" title="Alternar ordenação">Recentes</button>
      </div>
    </div>
    <div class="list" id="list" role="list"></div>
    <div class="side-foot">
      <span id="stats"></span>
      <span class="spacer"></span>
      <button class="icon-btn" id="openBtn" title="Abrir outro export (.zip)">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Alternar tema">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <input type="file" id="file" accept=".zip" hidden>
    </div>
  </aside>

  <main class="main" id="main">
    <button class="menu-btn" id="menuBtn" aria-label="Abrir lista">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<div class="drop" id="drop"><div>Solte o <b>.zip</b> do DeepSeek aqui</div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
